<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUNIX 名片掃描</title>
<meta name="theme-color" content="#1F6B50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="名片掃描">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF0EC; --surface:#FFFFFF; --ink:#1B2220; --muted:#5E6A66; --line:#D5DAD5;
  --accent:#1F6B50; --accent-ink:#FFFFFF; --accent-soft:#DCEBE3;
  --warn-soft:#FBEBD0; --bad:#A3302A; --bad-soft:#F7DEDB;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141917; --surface:#1D2421; --ink:#E7ECE9; --muted:#9AA6A1; --line:#2F3935;
  --accent:#5BC096; --accent-ink:#0E1A15; --accent-soft:#1E3A2E;
  --warn-soft:#3A2D16; --bad:#EE8A82; --bad-soft:#3D1F1C; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;padding:0 16px}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;display:grid;gap:18px}
h1{font-family:var(--display);font-size:34px;line-height:1;letter-spacing:.02em;margin:0}
h1 small{display:block;font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted);letter-spacing:.04em;margin-top:6px}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
h2{font-family:var(--display);font-size:20px;letter-spacing:.06em;margin:0;display:flex;align-items:center;gap:8px}
h2 .step{font-size:13px;color:var(--muted)}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{position:relative;aspect-ratio:1.75/1;max-width:100%;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;overflow:hidden;background:var(--bg)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot b{display:block;font-size:14px;color:var(--ink)}
.shot .x{position:absolute;top:6px;right:6px;z-index:2;border:0;background:var(--surface);color:var(--ink);border-radius:50%;width:26px;height:26px;font-size:15px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label{display:grid;gap:4px;font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em;min-width:0}
input[type=text],input[type=date],input[type=email],input[type=password],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:8px;padding:13px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.note{font-size:13px;border-radius:6px;padding:9px 12px;background:var(--accent-soft)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--accent)} .status.bad{color:var(--bad)}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.recent li:first-child{border-top:0}
.recent .who{font-weight:700;overflow-wrap:anywhere;min-width:0}
.recent .meta{color:var(--muted);font-size:12px;grid-column:1/-1}
.pill{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);align-self:start}
.empty{color:var(--muted);font-size:14px;margin:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
.field{display:grid;gap:8px}
.lbl{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.04em}
.addrow{display:grid;grid-template-columns:1fr auto;gap:8px}
.mini{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:0 12px;cursor:pointer;white-space:nowrap}
.mini:disabled{opacity:.45;cursor:not-allowed}
body{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<div class="wrap">
  <h1>RUNIX 名片掃描<small>拍照 → 自動辨識 → 存進 RUNIX 名片聯絡人</small></h1>

  <section id="gate" hidden>
    <h2>輸入通關碼</h2>
    <label for="codeInput">向 Lucio 取得通關碼，這支手機只需要輸入一次。<input id="codeInput" type="password" autocomplete="off"></label>
    <button class="btn" id="codeBtn">開始使用</button>
    <div class="status" id="codeStatus"></div>
  </section>

  <div id="app" hidden style="display:grid;gap:18px">
    <section>
      <h2><span class="step">1</span>拍名片</h2>
      <div class="shots">
        <div class="shot" id="shotFront"><span><b>正面</b>點這裡拍照或選圖</span>
          <input id="fileFront" type="file" accept="image/*" capture="environment" aria-label="名片正面"></div>
        <div class="shot" id="shotBack"><span><b>背面</b>選填</span>
          <input id="fileBack" type="file" accept="image/*" capture="environment" aria-label="名片背面"></div>
      </div>
      <div class="field">
        <span class="lbl" id="metLbl">認識場合</span>
        <div class="chips" id="metChips" role="group" aria-labelledby="metLbl"></div>
        <div class="addrow">
          <input id="met" type="text" placeholder="點選上面的選項，或輸入新的場合" aria-labelledby="metLbl">
          <button class="mini" id="addMetBtn" type="button" hidden>＋ 加入選項</button>
        </div>
        <div class="status" id="metStatus" role="status"></div>
      </div>
      <label for="metDate">認識日期<input id="metDate" type="date"></label>
      <label for="scanner">掃描人（你的名字）<input id="scanner" type="text" placeholder="例：Lucio"></label>
      <button class="btn" id="scanBtn" disabled>辨識名片</button>
      <div class="status" id="scanStatus" role="status"></div>
    </section>

    <section id="review">
      <h2><span class="step">2</span>確認資料</h2>
      <div class="note" id="reviewNote">辨識後資料會自動填在這裡，可以先修改再存檔。</div>
      <div class="row">
        <label for="f_name">姓名<input id="f_name" type="text"></label>
        <label for="f_company">公司<input id="f_company" type="text"></label>
      </div>
      <div class="row">
        <label for="f_title">職稱<input id="f_title" type="text"></label>
        <label for="f_email">Email<input id="f_email" type="email"></label>
      </div>
      <div class="row">
        <label for="f_mobile">手機<input id="f_mobile" type="text" inputmode="tel"></label>
        <label for="f_phone">電話<input id="f_phone" type="text" inputmode="tel"></label>
      </div>
      <label for="f_address">地址<input id="f_address" type="text"></label>
      <div class="row">
        <label for="f_website">網站<input id="f_website" type="text"></label>
        <label for="f_other">其他聯絡方式<input id="f_other" type="text" placeholder="LINE / WeChat / IG"></label>
      </div>
      <div>
        <label style="margin-bottom:6px">客戶分類</label>
        <div class="chips" id="cats">
          <button class="chip" type="button" data-v="經銷商" aria-pressed="false">經銷商</button>
          <button class="chip" type="button" data-v="創作者" aria-pressed="false">創作者</button>
          <button class="chip" type="button" data-v="供應商" aria-pressed="false">供應商</button>
          <button class="chip" type="button" data-v="其他" aria-pressed="false">其他</button>
        </div>
      </div>
      <label for="f_notes">備註<textarea id="f_notes" placeholder="聊到的需求、後續要做的事"></textarea></label>
      <div class="btns">
        <button class="btn ghost" id="resetBtn" type="button">清除</button>
        <button class="btn" id="saveBtn" type="button">存檔</button>
      </div>
      <div class="status" id="saveStatus" role="status"></div>
    </section>

    <section>
      <h2>最近存的名片</h2>
      <ul class="recent" id="recent"></ul>
      <p class="empty" id="recentEmpty">還沒有資料。</p>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ["name","company","title","mobile","phone","email","address","website","other"];
const shots = { front: null, back: null };
let category = "", code = "";

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const API_URL = "https://script.google.com/macros/s/AKfycbydsZB4qzTw8HLRwoMTL7ZuzB6QVAEnXMZakYAvA6tAgpAOJhDuEGOmeXX2Hu84MOJv/exec";
async function run(fn, ...args){
  let r;
  try {
    r = await fetch(API_URL, { method: "POST", credentials: "omit", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) });
  } catch(e) { throw new Error("連不上伺服器，請確認網路後再試一次。"); }
  let j;
  try { j = await r.json(); } catch(e) { throw new Error("伺服器回應異常（" + r.status + "），請稍後再試。"); }
  if (!j.ok) throw new Error(j.error || "發生錯誤");
  return j.result;
}
function errMsg(e){ return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, "").replace(/^Exception:\s*/, ""); }
function setStatus(id, msg, kind){
  const el = $(id); el.className = "status" + (kind && kind !== "busy" ? " " + kind : ""); el.textContent = "";
  if (!msg) return;
  if (kind === "busy"){ const s = document.createElement("span"); s.className = "spin"; el.append(s); }
  el.append(msg);
}
function note(msg, kind){ const n = $("reviewNote"); n.className = "note" + (kind ? " " + kind : ""); n.textContent = msg; }
function today(){ const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

// ---------- 通關碼 ----------
async function start(){
  code = store.get("accessCode", "");
  let cfg = { needsCode: false };
  try { cfg = await run("getConfig"); } catch(e){}
  if (cfg.needsCode && !code){ $("gate").hidden = false; return; }
  if (cfg.needsCode){
    try { await run("verifyCode", code); } catch(e){ code = ""; $("gate").hidden = false; return; }
  }
  openApp();
}
$("codeBtn").onclick = async () => {
  const c = $("codeInput").value.trim(); if (!c) return;
  setStatus("codeStatus", "確認中…", "busy");
  try { await run("verifyCode", c); code = c; store.set("accessCode", c); $("gate").hidden = true; openApp(); }
  catch(e){ setStatus("codeStatus", errMsg(e), "bad"); }
};
function openApp(){
  $("app").hidden = false;
  $("metDate").value = today();
  $("met").value = store.get("lastMet", "");
  $("scanner").value = store.get("scanner", "");
  try { events = JSON.parse(store.get("events", "[]")) || []; } catch(e) { events = []; }
  renderEvents();
  loadEvents();
  loadRecent();
}

// ---------- 認識場合選項（所有人共用，存在 Sheet 的「選項」分頁） ----------
let events = [];
function renderEvents(){
  const v = $("met").value.trim(), box = $("metChips");
  box.textContent = "";
  for (const ev of events){
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = ev;
    b.setAttribute("aria-pressed", String(v === ev));
    b.onclick = () => { $("met").value = $("met").value.trim() === ev ? "" : ev; setStatus("metStatus", ""); renderEvents(); };
    box.append(b);
  }
  $("addMetBtn").hidden = !v || events.some(e => e.toLowerCase() === v.toLowerCase());
}
async function loadEvents(){
  try { events = await run("getEvents", code); store.set("events", JSON.stringify(events)); } catch(e) {}
  renderEvents();
}
$("met").addEventListener("input", () => { setStatus("metStatus", ""); renderEvents(); });
$("addMetBtn").onclick = async () => {
  const name = $("met").value.trim(); if (!name) return;
  $("addMetBtn").disabled = true;
  setStatus("metStatus", "加入中…", "busy");
  try {
    events = await run("addEvent", name, code);
    store.set("events", JSON.stringify(events));
    setStatus("metStatus", "已加入選項「" + name + "」，所有同事都看得到。", "ok");
  } catch(e) { setStatus("metStatus", "加入失敗：" + errMsg(e), "bad"); }
  finally { $("addMetBtn").disabled = false; renderEvents(); }
};

// ---------- 照片 ----------
async function shrink(file, max = 1600, q = 0.82){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { URL.revokeObjectURL(url); }
}
function bindShot(side, inputId, boxId){
  $(inputId).addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    try { shots[side] = await shrink(f); } catch(err){ setStatus("scanStatus", "這張圖片讀不出來，請重拍。", "bad"); return; }
    const box = $(boxId);
    box.querySelector("img")?.remove(); box.querySelector(".x")?.remove();
    const img = document.createElement("img"); img.src = shots[side]; img.alt = side === "front" ? "名片正面" : "名片背面"; box.prepend(img);
    const x = document.createElement("button"); x.className = "x"; x.type = "button"; x.textContent = "×"; x.setAttribute("aria-label", "移除");
    x.onclick = ev => { ev.stopPropagation(); shots[side] = null; img.remove(); x.remove(); $(inputId).value = ""; refresh(); };
    box.append(x); refresh();
  });
}
bindShot("front", "fileFront", "shotFront");
bindShot("back", "fileBack", "shotBack");
function refresh(){ $("scanBtn").disabled = !shots.front; }
function imagesPayload(){ return [shots.front, shots.back].filter(Boolean).map(d => ({ data: d.split(",")[1] })); }

// ---------- 分類 ----------
function setCat(v){ category = v || ""; for (const b of $("cats").children) b.setAttribute("aria-pressed", String(b.dataset.v === category)); }
$("cats").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setCat(category === b.dataset.v ? "" : b.dataset.v); });

// ---------- 辨識 ----------
$("scanBtn").onclick = async () => {
  $("scanBtn").disabled = true;
  setStatus("scanStatus", "辨識中…（約 5–15 秒）", "busy");
  try{
    const r = await run("scanCard", imagesPayload(), code);
    for (const k of FIELDS) $("f_" + k).value = r[k] || "";
    if (r.category) setCat(r.category);
    if (r.card_notes && !$("f_notes").value) $("f_notes").value = r.card_notes;
    setStatus("scanStatus", "");
    note("辨識完成。請核對姓名與電話，確認後按「存檔」。");
    $("review").scrollIntoView({ behavior: "smooth", block: "start" });
  }catch(e){ setStatus("scanStatus", errMsg(e) + "　也可以直接手動填寫下方欄位。", "bad"); }
  finally{ refresh(); }
};

// ---------- 存檔 ----------
$("saveBtn").onclick = async () => {
  const card = Object.fromEntries(FIELDS.map(k => [k, $("f_" + k).value.trim()]));
  if (!card.name && !card.company){ setStatus("saveStatus", "至少要有姓名或公司才能存檔。", "bad"); return; }
  Object.assign(card, { category, met: $("met").value.trim(), metDate: $("metDate").value, notes: $("f_notes").value.trim(), scanner: $("scanner").value.trim() });
  $("saveBtn").disabled = true;
  setStatus("saveStatus", "存檔中…", "busy");
  try{
    const r = await run("saveCard", card, imagesPayload(), code);
    store.set("lastMet", card.met); store.set("scanner", card.scanner);
    setStatus("saveStatus", "已存檔：" + (card.name || card.company), "ok");
    clearCard();
    if (r.duplicate) note("提醒：Sheet 第 " + r.duplicate.row + " 列已有相同 Email 或手機（" + (r.duplicate.name || r.duplicate.company) + "），這筆仍已存入，可再確認是否重複。", "warn");
    loadRecent();
  }catch(e){ setStatus("saveStatus", "存檔失敗：" + errMsg(e), "bad"); }
  finally{ $("saveBtn").disabled = false; }
};
function clearCard(){
  for (const k of FIELDS) $("f_" + k).value = "";
  $("f_notes").value = ""; setCat("");
  for (const [s, input, box] of [["front","fileFront","shotFront"],["back","fileBack","shotBack"]]){
    shots[s] = null; $(input).value = ""; $(box).querySelector("img")?.remove(); $(box).querySelector(".x")?.remove();
  }
  note("可以拍下一張了。認識場合、日期和掃描人會保留。");
  refresh();
}
$("resetBtn").onclick = () => { clearCard(); setStatus("saveStatus", ""); setStatus("scanStatus", ""); };

// ---------- 最近 ----------
async function loadRecent(){
  try{
    const rows = await run("getRecent", code);
    const ul = $("recent"); ul.textContent = "";
    $("recentEmpty").hidden = rows.length > 0;
    for (const r of rows){
      const li = document.createElement("li");
      const who = document.createElement("span"); who.className = "who"; who.textContent = [r.name, r.company].filter(Boolean).join(" · "); li.append(who);
      if (r.category){ const p = document.createElement("span"); p.className = "pill"; p.textContent = r.category; li.append(p); }
      const m = document.createElement("span"); m.className = "meta"; m.textContent = [r.at, r.met, r.scanner && ("by " + r.scanner)].filter(Boolean).join(" · "); li.append(m);
      ul.append(li);
    }
  }catch(e){}
}

start();
</script>
</body>
</html>
