<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RUNIX Card Scanner</title>
<meta name="theme-color" content="#111511">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Card Scanner">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<link rel="icon" href="icon-512.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --ink:#151A15; --muted:#5B665B; --line:#D3DAD2;
  --brand:#36D330; --accent:#1B8A17; --accent-ink:#FFFFFF; --accent-soft:#DDF3DA;
  --warn-soft:#FBEBD0; --bad:#A3302A; --bad-soft:#F7DEDB;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#111511; --surface:#1A201A; --ink:#E8EDE7; --muted:#9AA79A; --line:#2D362D;
  --brand:#36D330; --accent:#45DB3E; --accent-ink:#0A1A09; --accent-soft:#1D3A1C;
  --warn-soft:#3A2D16; --bad:#EE8A82; --bad-soft:#3D1F1C; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding:0 16px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding-block:20px 48px;display:grid;gap:18px}
header{display:grid;gap:6px}
.logo{display:block;width:190px;max-width:60%;height:auto}
.logo path{fill:var(--brand)}
.tagline{font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0}
section{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:14px}
h2{font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:10px}
h2 .step{font-size:13px;color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:1px 7px;letter-spacing:0}
.shots{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shot{position:relative;aspect-ratio:1.75/1;max-width:100%;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;overflow:hidden;background:var(--bg)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot input{position:absolute;inset:0;opacity:0;cursor:pointer}
.shot b{display:block;font-size:15px;color:var(--ink)}
.shot .x{position:absolute;top:6px;right:6px;z-index:2;border:0;background:var(--surface);color:var(--ink);border-radius:50%;width:26px;height:26px;font-size:15px;cursor:pointer}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.row{grid-template-columns:1fr}}
label,.lbl{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;min-width:0}
input[type=text],input[type=date],input[type=email],input[type=password],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0;font-weight:400}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;max-width:100%;min-height:44px;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
textarea{min-height:64px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn{font:inherit;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.06em;text-transform:uppercase;border:0;border-radius:8px;padding:12px 16px;cursor:pointer;background:var(--accent);color:var(--accent-ink);width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.note{font-size:14px;border-radius:6px;padding:9px 12px;background:var(--accent-soft)}
.note.warn{background:var(--warn-soft)} .note.bad{background:var(--bad-soft)}
.status{font-size:14px;color:var(--muted);min-height:1.2em}
.status.ok{color:var(--accent)} .status.bad{color:var(--bad)}
.recent{list-style:none;margin:0;padding:0}
.recent li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.recent li:first-child{border-top:0}
.recent .who{font-weight:700;overflow-wrap:anywhere;min-width:0}
.recent .meta{color:var(--muted);font-size:13px;grid-column:1/-1}
.pill{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);align-self:start}
.empty{color:var(--muted);font-size:15px;margin:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
[hidden]{display:none!important}
.field{display:grid;gap:8px}
.addrow{display:flex;gap:8px;align-items:stretch}
.addrow input{flex:1 1 auto}
.mini{font:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;padding:0 12px;cursor:pointer;white-space:nowrap}
.mini:disabled{opacity:.45;cursor:not-allowed}
.scan{display:grid;gap:12px}
.drop{position:relative;width:100%;max-width:100%;aspect-ratio:1.6/1;border:2px dashed var(--accent);border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;text-align:center;overflow:hidden;cursor:pointer;color:var(--ink)}
.drop.has{border-style:solid;border-color:var(--line);background:var(--ink)}
.drop.drag{outline:3px solid var(--accent);outline-offset:2px}
.drop img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.drop .ph{display:grid;gap:6px;justify-items:center;padding:16px}
.drop svg{width:56px;height:56px;stroke:var(--accent);fill:none;stroke-width:2.2;stroke-linejoin:round}
.drop .big{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.drop .sub{font-size:14px;color:var(--muted)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick label{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;border-radius:10px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:var(--accent-ink);background:var(--accent);border:1.5px solid var(--accent)}
.pick label.alt{background:transparent;color:var(--accent)}
.pick label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.pick input,.backrow input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.backrow{display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-height:32px}
.backthumb{width:72px;aspect-ratio:1.6/1;border-radius:6px;object-fit:cover;border:1px solid var(--line)}
.linkbtn,.backrow label.linkbtn{display:inline;font:inherit;font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--accent);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
details.ev{border-top:1px solid var(--line);padding-top:12px}
details.ev summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:15px}
details.ev summary::-webkit-details-marker{display:none}
details.ev summary .sum{color:var(--muted);min-width:0;overflow-wrap:anywhere}
details.ev summary .edit{color:var(--accent);font-weight:700;white-space:nowrap}
details.ev[open] summary .edit{display:none}
.evbody{display:grid;gap:14px;margin-top:12px}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="140 155 1720 395" role="img" aria-label="RUNIX">
      <path d="M145 417 L425 320 L425 384 L1064 163 L1064 208 L316 543 L316 484 L145 543 Z"/>
      <path fill-rule="evenodd" d="M858 349 H1010 C1040 349 1064 373 1064 404 C1064 426 1051 444 1033 451 L1078 504 H1020 L980 458 H903 V504 H858 Z M903 390 H1008 C1015 390 1021 396 1021 403 C1021 410 1015 415 1008 415 H903 Z"/>
      <path d="M1094 349 H1137 V441 C1137 452 1146 461 1157 461 H1238 C1249 461 1258 452 1258 441 V349 H1302 V441 C1302 476 1274 504 1239 504 H1157 C1122 504 1094 476 1094 441 Z"/>
      <path d="M1330 349 L1489 435 V349 H1533 V504 L1375 418 V504 H1330 Z"/>
      <path d="M1569 349 H1613 V504 H1569 Z"/>
      <path d="M1632 349 H1694 L1743 396 L1791 349 H1855 L1775 428 L1855 504 H1791 L1743 457 L1694 504 H1632 L1711 428 Z"/>
    </svg>
    <p class="tagline">Business Card Scanner</p>
  </header>

  <section id="gate" hidden>
    <h2>Enter access code</h2>
    <label for="codeInput">Get the code from Lucio. You only need to enter it once on this phone.<input id="codeInput" type="password" autocomplete="off"></label>
    <button class="btn" id="codeBtn">Start</button>
    <div class="status" id="codeStatus"></div>
  </section>

  <div id="app" hidden style="display:grid;gap:18px">
    <section>
      <h2><span class="step">1</span>Scan the card</h2>
      <div class="scan">
        <div class="drop" id="drop" role="button" tabindex="0" aria-label="Scan the card front: take a photo or choose from library">
          <div class="ph" id="dropPh">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="5" y="13" width="38" height="27" rx="4"/><path d="M17 13l3-5h8l3 5"/><circle cx="24" cy="26.5" r="7.5"/></svg>
            <span class="big">Tap to scan card</span>
            <span class="sub">Take a photo or choose one from your library</span>
          </div>
        </div>
        <input id="fileLib" class="vh" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
        <div class="backrow">
          <img class="backthumb" id="backThumb" alt="Card back" hidden>
          <label for="fileBack" class="linkbtn" id="backLbl">+ Add back side (optional)<input id="fileBack" type="file" accept="image/*"></label>
          <button class="linkbtn" id="backRemove" type="button" hidden>Remove</button>
        </div>
        <button class="btn" id="scanBtn" disabled>Scan card</button>
        <div class="status" id="scanStatus" role="status"></div>
      </div>
      <details class="ev" id="evBox">
        <summary><span class="sum" id="evSum">Event details</span><span class="edit">Edit</span></summary>
        <div class="evbody">
          <div class="field">
            <span class="lbl" id="metLbl">Where we met</span>
            <div class="chips" id="metChips" role="group" aria-labelledby="metLbl"></div>
            <div class="addrow">
              <input id="met" type="text" placeholder="Pick one above, or type a new event" aria-labelledby="metLbl">
              <button class="mini" id="addMetBtn" type="button" hidden>+ Add option</button>
            </div>
            <div class="status" id="metStatus" role="status"></div>
          </div>
          <label for="metDate">Date met<input id="metDate" type="date"></label>
          <label for="scanner">Scanned by (your name)<input id="scanner" type="text" placeholder="e.g. Lucio"></label>
        </div>
      </details>
    </section>

    <section id="review">
      <h2><span class="step">2</span>Check details</h2>
      <div class="note" id="reviewNote">Scanned details appear here. You can edit them before saving.</div>
      <div class="row">
        <label for="f_name">Name<input id="f_name" type="text"></label>
        <label for="f_company">Company<input id="f_company" type="text"></label>
      </div>
      <div class="row">
        <label for="f_title">Job title<input id="f_title" type="text"></label>
        <label for="f_email">Email<input id="f_email" type="email"></label>
      </div>
      <div class="row">
        <label for="f_mobile">Mobile<input id="f_mobile" type="text" inputmode="tel"></label>
        <label for="f_phone">Phone<input id="f_phone" type="text" inputmode="tel"></label>
      </div>
      <div class="row">
        <label for="f_address">Address<input id="f_address" type="text"></label>
        <label for="f_country">Country<input id="f_country" type="text" placeholder="e.g. United States"></label>
      </div>
      <div class="row">
        <label for="f_website">Website<input id="f_website" type="text"></label>
        <label for="f_other">Other contacts<input id="f_other" type="text" placeholder="WhatsApp / WeChat / IG"></label>
      </div>
      <div>
        <span class="lbl" style="margin-bottom:6px">Contact type</span>
        <div class="chips" id="cats">
          <button class="chip" type="button" data-v="Dealer" aria-pressed="false">Dealer</button>
          <button class="chip" type="button" data-v="Creator" aria-pressed="false">Creator</button>
          <button class="chip" type="button" data-v="Supplier" aria-pressed="false">Supplier</button>
          <button class="chip" type="button" data-v="Other" aria-pressed="false">Other</button>
        </div>
      </div>
      <label for="f_notes">Notes<textarea id="f_notes" placeholder="What you talked about, follow-ups"></textarea></label>
      <div class="btns">
        <button class="btn ghost" id="resetBtn" type="button">Clear</button>
        <button class="btn" id="saveBtn" type="button">Save</button>
      </div>
      <div class="status" id="saveStatus" role="status"></div>
    </section>

    <section>
      <h2>Recently saved</h2>
      <ul class="recent" id="recent"></ul>
      <p class="empty" id="recentEmpty">No cards yet.</p>
    </section>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const FIELDS = ["name","company","title","mobile","phone","email","address","country","website","other"];
const shots = { front: null, back: null };
let category = "", code = "";

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};
const API_URL = "https://script.google.com/macros/s/AKfycbydsZB4qzTw8HLRwoMTL7ZuzB6QVAEnXMZakYAvA6tAgpAOJhDuEGOmeXX2Hu84MOJv/exec";
async function run(fn, ...args){
  let r;
  try {
    r = await fetch(API_URL, { method: "POST", credentials: "omit", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ fn, args }) });
  } catch(e) { throw new Error("Can't reach the server. Check your connection and try again."); }
  let j;
  try { j = await r.json(); } catch(e) { throw new Error("The server sent an unexpected response (" + r.status + "). Try again in a moment."); }
  if (!j.ok) throw new Error(j.error || "Something went wrong.");
  return j.result;
}
function errMsg(e){ return (e && e.message ? e.message : String(e)).replace(/^Error:\s*/, "").replace(/^Exception:\s*/, ""); }
function setStatus(id, msg, kind){
  const el = $(id); el.className = "status" + (kind && kind !== "busy" ? " " + kind : ""); el.textContent = "";
  if (!msg) return;
  if (kind === "busy"){ const s = document.createElement("span"); s.className = "spin"; el.append(s); }
  el.append(msg);
}
function note(msg, kind){ const n = $("reviewNote"); n.className = "note" + (kind ? " " + kind : ""); n.textContent = msg; }
function today(){ const d = new Date(); return new Date(d - d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }

// ---------- access code ----------
async function start(){
  code = store.get("accessCode", "");
  let cfg = { needsCode: false };
  try { cfg = await run("getConfig"); } catch(e){}
  if (cfg.needsCode && !code){ $("gate").hidden = false; return; }
  if (cfg.needsCode){
    try { await run("verifyCode", code); } catch(e){ code = ""; $("gate").hidden = false; return; }
  }
  openApp();
}
$("codeBtn").onclick = async () => {
  const c = $("codeInput").value.trim(); if (!c) return;
  setStatus("codeStatus", "Checking…", "busy");
  try { await run("verifyCode", c); code = c; store.set("accessCode", c); $("gate").hidden = true; openApp(); }
  catch(e){ setStatus("codeStatus", errMsg(e), "bad"); }
};
function openApp(){
  $("app").hidden = false;
  setTimeout(() => { updateEvSum(); $("evBox").open = !$("scanner").value.trim(); }, 0);
  $("metDate").value = today();
  $("met").value = store.get("lastMet", "");
  $("scanner").value = store.get("scanner", "");
  try { events = JSON.parse(store.get("events", "[]")) || []; } catch(e) { events = []; }
  renderEvents();
  loadEvents();
  loadRecent();
}

// ---------- event options (shared, stored in the Sheet's 選項 tab) ----------
let events = [];
function renderEvents(){
  const v = $("met").value.trim(), box = $("metChips");
  box.textContent = "";
  for (const ev of events){
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = ev;
    b.setAttribute("aria-pressed", String(v === ev));
    b.onclick = () => { $("met").value = $("met").value.trim() === ev ? "" : ev; setStatus("metStatus", ""); renderEvents(); };
    box.append(b);
  }
  $("addMetBtn").hidden = !v || events.some(e => e.toLowerCase() === v.toLowerCase());
  updateEvSum();
}
async function loadEvents(){
  try { events = await run("getEvents", code); store.set("events", JSON.stringify(events)); } catch(e) {}
  renderEvents();
}
$("met").addEventListener("input", () => { setStatus("metStatus", ""); renderEvents(); });
$("addMetBtn").onclick = async () => {
  const name = $("met").value.trim(); if (!name) return;
  $("addMetBtn").disabled = true;
  setStatus("metStatus", "Adding…", "busy");
  try {
    events = await run("addEvent", name, code);
    store.set("events", JSON.stringify(events));
    setStatus("metStatus", "Added “" + name + "”. Everyone on the team will see it.", "ok");
  } catch(e) { setStatus("metStatus", "Couldn't add it: " + errMsg(e), "bad"); }
  finally { $("addMetBtn").disabled = false; renderEvents(); }
};

// ---------- photos ----------
async function shrink(file, max = 1600, q = 0.82){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", q);
  } finally { URL.revokeObjectURL(url); }
}
function setFront(url){
  shots.front = url;
  const d = $("drop");
  d.querySelector("img")?.remove();
  if (url){ const img = document.createElement("img"); img.src = url; img.alt = "Card front"; d.prepend(img); }
  d.classList.toggle("has", !!url);
  $("dropPh").hidden = !!url;
  d.setAttribute("aria-label", url ? "Retake the card front" : "Take a photo of the card front");
  refresh();
}
function setBack(url){
  shots.back = url;
  $("backThumb").hidden = !url; if (url) $("backThumb").src = url;
  $("backRemove").hidden = !url;
  $("backLbl").firstChild.nodeValue = url ? "Change back side" : "+ Add back side (optional)";
  refresh();
}
async function takeFile(side, f){
  if (!f) return;
  let url;
  try { url = await shrink(f); } catch(err){ setStatus("scanStatus", "This photo can't be read. Please retake it.", "bad"); return; }
  if (side === "front"){ setFront(url); doScan(); }
  else { setBack(url); if (shots.front) setStatus("scanStatus", "Back side added. Tap Scan card to read both sides."); }
}
for (const id of ["fileLib"]) $(id).addEventListener("change", e => { takeFile("front", e.target.files && e.target.files[0]); e.target.value = ""; });
$("fileBack").addEventListener("change", e => { takeFile("back", e.target.files && e.target.files[0]); e.target.value = ""; });
$("backRemove").onclick = () => setBack(null);
$("drop").onclick = () => $("fileLib").click();
$("drop").onkeydown = e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); $("fileLib").click(); } };
for (const t of ["dragenter", "dragover"]) $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("drag"); });
$("drop").addEventListener("dragleave", () => $("drop").classList.remove("drag"));
$("drop").addEventListener("drop", e => { e.preventDefault(); $("drop").classList.remove("drag"); takeFile("front", e.dataTransfer.files && e.dataTransfer.files[0]); });

// ---------- event details summary ----------
function updateEvSum(){
  const who = $("scanner").value.trim();
  $("evSum").textContent = [$("met").value.trim() || "No event picked", $("metDate").value, who ? "by " + who : "add your name"].filter(Boolean).join(" \u00B7 ");
}
for (const id of ["met", "metDate", "scanner"]) $(id).addEventListener("input", updateEvSum);
// remember the scanner name (and event) on this phone as soon as it is typed
$("scanner").addEventListener("input", () => store.set("scanner", $("scanner").value.trim()));
$("met").addEventListener("change", () => store.set("lastMet", $("met").value.trim()));
function refresh(){ $("scanBtn").disabled = !shots.front; }
function imagesPayload(){ return [shots.front, shots.back].filter(Boolean).map(d => ({ data: d.split(",")[1] })); }

// ---------- contact type ----------
function setCat(v){ category = v || ""; for (const b of $("cats").children) b.setAttribute("aria-pressed", String(b.dataset.v === category)); }
$("cats").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setCat(category === b.dataset.v ? "" : b.dataset.v); });

// ---------- scan ----------
async function doScan(){
  if (!shots.front) return;
  $("scanBtn").disabled = true;
  setStatus("scanStatus", "Reading the card… (about 5–15 seconds)", "busy");
  try{
    const r = await run("scanCard", imagesPayload(), code);
    for (const k of FIELDS) $("f_" + k).value = r[k] || "";
    if (r.category) setCat(r.category);
    if (r.card_notes && !$("f_notes").value) $("f_notes").value = r.card_notes;
    setStatus("scanStatus", "");
    note("Done. Check the name and phone numbers, then tap Save.");
    $("review").scrollIntoView({ behavior: "smooth", block: "start" });
  }catch(e){ setStatus("scanStatus", errMsg(e) + " You can also fill in the fields below by hand.", "bad"); }
  finally{ refresh(); }
}
$("scanBtn").onclick = doScan;

// ---------- save ----------
$("saveBtn").onclick = async () => {
  const card = Object.fromEntries(FIELDS.map(k => [k, $("f_" + k).value.trim()]));
  if (!card.name && !card.company){ setStatus("saveStatus", "Enter at least a name or a company before saving.", "bad"); return; }
  Object.assign(card, { category, met: $("met").value.trim(), metDate: $("metDate").value, notes: $("f_notes").value.trim(), scanner: $("scanner").value.trim() });
  $("saveBtn").disabled = true;
  setStatus("saveStatus", "Saving…", "busy");
  try{
    const r = await run("saveCard", card, imagesPayload(), code);
    store.set("lastMet", card.met); store.set("scanner", card.scanner);
    setStatus("saveStatus", "Saved: " + (card.name || card.company), "ok");
    clearCard();
    if (r.duplicate) note("Heads up: row " + r.duplicate.row + " in the Sheet has the same email or mobile (" + (r.duplicate.name || r.duplicate.company) + "). This card was still saved, so check for a duplicate.", "warn");
    loadRecent();
  }catch(e){ setStatus("saveStatus", "Couldn't save: " + errMsg(e), "bad"); }
  finally{ $("saveBtn").disabled = false; }
};
function clearCard(){
  for (const k of FIELDS) $("f_" + k).value = "";
  $("f_notes").value = ""; setCat("");
  setFront(null); setBack(null);
  note("Ready for the next card. Event, date and your name are kept.");
  refresh();
  window.scrollTo({ top: 0, behavior: "smooth" });
}
$("resetBtn").onclick = () => { clearCard(); setStatus("saveStatus", ""); setStatus("scanStatus", ""); };

// ---------- recent ----------
async function loadRecent(){
  try{
    const rows = await run("getRecent", code);
    const ul = $("recent"); ul.textContent = "";
    $("recentEmpty").hidden = rows.length > 0;
    for (const r of rows){
      const li = document.createElement("li");
      const who = document.createElement("span"); who.className = "who"; who.textContent = [r.name, r.company].filter(Boolean).join(" · "); li.append(who);
      if (r.category){ const p = document.createElement("span"); p.className = "pill"; p.textContent = r.category; li.append(p); }
      const m = document.createElement("span"); m.className = "meta"; m.textContent = [r.at, r.met, r.scanner && ("by " + r.scanner)].filter(Boolean).join(" · "); li.append(m);
      ul.append(li);
    }
  }catch(e){}
}

start();
</script>
</body>
